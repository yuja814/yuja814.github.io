<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차:다움 | 장바구니</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }
         html, body {
            width: 100%;
            background: #1c1c1c;
        }
        @media only screen and (min-width : 600px) {
            .c_m_1 {width: 8.33%;}
            .c_m_2 {width: 16.66%;}
            .c_m_3 {width: 25%;}
            .c_m_4 {width: 33.33%;}
            .c_m_5 {width: 41.66%;}
            .c_m_6 {width: 50%;}
            .c_m_7 {width: 58.33%;}
            .c_m_8 {width: 66.66%;}
            .c_m_9 {width: 75%;}
            .c_m_10 {width: 83.33%;}
            .c_m_11 {width: 91.66%;}
            .c_m_12 {width: 100%;}
        }
        @media only screen and (min-width : 768px) {
            .c_1 {width: 8.33%;}
            .c_2 {width: 16.66%;}
            .c_3 {width: 25%;}
            .c_4 {width: 33.33%;}
            .c_5 {width: 41.66%;}
            .c_6 {width: 50%;}
            .c_7 {width: 58.33%;}
            .c_8 {width: 66.66%;}
            .c_9 {width: 75%;}
            .c_10 {width: 83.33%;}
            .c_11 {width: 91.66%;}
            .c_12 {width: 100%;}
        }
        @media only screen and (max-width: 1024px) {
            [class*="c_"] {
                float: left;
                width: 100%;
            }
            .c_m_4 { width: 33.33% !important; }
            .c_m_6 { width: 50% !important; }
            .c_m_12 { width: 100% !important; }
        }
        header {
            height: 50px; 
            display: flex;
            align-items: center;
            justify-content: space-between; 
            padding: 0 80px;
            background-color: #1c1c1c;
            width: 100%;
        }   
        header .home-logo a {
            color: #FFA126;
            text-decoration: none;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
        }
        header #main_nav ul {
            display: flex;
            gap: 35px; 
            list-style: none;
        }
        header #main_nav ul li a {
            color: #fafafa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }
        header #main_nav ul li a:hover { 
            color: #738A3D; 
        }
        
        header #login ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        header #login li a {
            color: #b3b3b3; 
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s ease;
        }
        header #login li a:hover { 
            color: #FFA126; 
        }
        .main-container {
            width: 100%;
            padding: 120px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            width: 360px;
            padding: 50px 40px;
            background: #ffffff;
            border: 1px solid #e7e7e7;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
        }
        .login-title a {
            text-decoration: none;
            color: #222;
            letter-spacing: 0.5px;
        }
        .login-title a:hover {
            color: #FFA126;
        }
        .cart-container {
            max-width: 965px;
            margin: 0 auto;
            background-color: #fafafa;
            padding: 40px;
            border: 1px solid #1c1c1c;
            border-radius: 10px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            border-bottom: 2px solid #1c1c1c;
            padding-bottom: 15px;
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }
        .cart-table th, .cart-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .cart-table th {
            background-color: #1c1c1c;
            color: #fafafa;
            font-size: 14px;
        }
        .cart-table td {
            font-size: 15px;
        }
        .product-info {
            text-align: left;
            font-weight: 600;
        }
        .total-box {
            text-align: right;
            padding: 20px;
            background-color: #ededed;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 30px;
            border-radius: 6px;
        }
        .total-box span {
            color: #FFA126;
            font-size: 22px;
            margin-left: 10px;
        }
        .btn-group {
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin: 0 10px;
            cursor: pointer;
            border-radius: 6px;
        }
        .btn-shop {
            background-color: transparent;
            color: #1c1c1c;
            border: 1px solid #1c1c1c;
            border-radius: 6px;
        }
        .btn-order {
            background-color: #1c1c1c;
            color: #fafafa;
            border: none;
            border-radius: 6px;
        }
        .btn-order:hover {
            color: #1c1c1c;
            background-color: #738A3D;
        }
        @media only screen and (max-width : 1024px) {
            header { 
                padding: 10px 20px; 
                flex-wrap: wrap; 
                height: auto; 
                gap: 10px; 
            }
            header #main_nav { 
                width: 100%; 
                order: 3; 
                text-align: center; 
            }
            header #main_nav ul { 
                gap: 20px; 
                justify-content: center; 
            }
            header #main_nav ul li a { 
                font-size: 13px; 
            }
            header #login { 
                margin-left: auto; 
                order: 2; 
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="home-logo"><a href="index.html">CHA:DAUM</a></div>
        <nav id="main_nav">
            <ul>
                <li><a href="blend.html">BLEND</a></li>
                <li><a href="teanote.html">TEA NOTE</a></li>
                <li><a href="aroma.html">AROMA</a></li>
                <li><a href="moment.html">MOMENT</a></li>
                <li><a href="brewing.html">BREWING</a></li>
            </ul>
        </nav>
        <nav id="login">
            <ul>
                <li><a href="./login.html">로그인</a></li>
                <li><a href="./signup.html">회원가입</a></li>
                <li><a href="./cart.html">장바구니</a></li>
                <li><a href="./mypage.html">마이페이지</a></li>
            </ul>
        </nav>
    </header>

    <div class="cart-container">
        <h1>장바구니</h1>
        <table class="cart-table">
            <thead>
                <tr>
                    <th style="width: 50%;">상품 정보</th>
                    <th style="width: 15%;">판매가</th>
                    <th style="width: 15%;">수량</th>
                    <th style="width: 20%;">합계 금액</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="product-info">01. 숲의 새벽 (블랜드 티 팩)</td>
                    <td>18,000원</td>
                    <td>1</td>
                    <td>18,000원</td>
                </tr>
                <tr>
                    <td class="product-info">차다움 모던 유리 개완(蓋碗)</td>
                    <td>38,000원</td>
                    <td>2</td>
                    <td>76,000원</td>
                </tr>
            </tbody>
        </table>
        <div class="total-box">
            총 주문 금액 : 18,000원 + 76,000원 = <span>94,000원</span>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn btn-shop">쇼핑 계속하기</a>
            <a href="#" class="btn btn-order" onclick="alert('주문 페이지로 이동합니다.')">주문하기</a>
        </div>
    </div>

</body>
</html>
